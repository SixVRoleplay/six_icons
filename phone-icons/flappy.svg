<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa8e8"/>
      <stop offset="0.6" stop-color="#7dd3fc"/>
      <stop offset="0.85" stop-color="#c8ecfb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f0c05e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Himmel -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sonne -->
  <circle cx="415" cy="95" r="110" fill="url(#sunglow)"/>
  <circle cx="415" cy="95" r="48" fill="#fde047"/>

  <!-- Wolken -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <circle cx="105" cy="120" r="30"/>
      <circle cx="140" cy="128" r="24"/>
      <circle cx="75" cy="130" r="20"/>
      <circle cx="112" cy="102" r="20"/>
    </g>
    <g opacity="0.8">
      <circle cx="330" cy="215" r="22"/>
      <circle cx="356" cy="221" r="17"/>
      <circle cx="306" cy="222" r="15"/>
    </g>
  </g>

  <!-- Meer -->
  <rect y="388" width="512" height="62" fill="url(#sea)"/>
  <path d="M0 388 q16 -12 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

  <!-- Strand -->
  <rect y="450" width="512" height="62" fill="url(#sand)"/>
  <g fill="#b48232" opacity="0.4">
    <circle cx="60" cy="478" r="5"/>
    <circle cx="150" cy="492" r="4"/>
    <circle cx="250" cy="475" r="5"/>
    <circle cx="350" cy="493" r="4"/>
    <circle cx="450" cy="480" r="5"/>
  </g>

  <!-- Vogel -->
  <g transform="translate(210 245) rotate(-8)">
    <ellipse cx="0" cy="0" rx="92" ry="80" fill="url(#body)"/>
    <ellipse cx="-14" cy="26" rx="52" ry="38" fill="#fde68a"/>
    <ellipse cx="-34" cy="-6" rx="46" ry="30" fill="#f59e0b" transform="rotate(-18 -34 -6)"/>
    <circle cx="38" cy="-26" r="27" fill="#ffffff"/>
    <circle cx="47" cy="-26" r="13" fill="#1c1917"/>
    <circle cx="51" cy="-30" r="4.5" fill="#ffffff"/>
    <path d="M74 -6 L136 12 L70 32 Z" fill="#f97316"/>
  </g>
</svg>
