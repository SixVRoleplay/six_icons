<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d5e2c"/>
      <stop offset="1" stop-color="#0b5142"/>
    </linearGradient>
    <linearGradient id="seg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="foodglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#4ade80" stroke-opacity="0.13" stroke-width="3">
    <path d="M85 0V512M170 0V512M256 0V512M342 0V512M427 0V512"/>
    <path d="M0 85H512M0 170H512M0 256H512M0 342H512M0 427H512"/>
  </g>
  <g fill="#4ade80" opacity="0.05">
    <rect x="85" y="0" width="85" height="85"/>
    <rect x="256" y="85" width="86" height="85"/>
    <rect x="0" y="170" width="85" height="86"/>
    <rect x="342" y="256" width="85" height="86"/>
    <rect x="170" y="342" width="86" height="85"/>
    <rect x="427" y="427" width="85" height="85"/>
  </g>

  <!-- Schlange -->
  <g>
    <rect x="96" y="352" width="70" height="70" rx="20" fill="url(#seg)" opacity="0.5"/>
    <rect x="96" y="266" width="70" height="70" rx="20" fill="url(#seg)" opacity="0.68"/>
    <rect x="96" y="180" width="70" height="70" rx="20" fill="url(#seg)" opacity="0.85"/>
    <rect x="182" y="180" width="70" height="70" rx="20" fill="url(#seg)"/>
    <rect x="268" y="180" width="70" height="70" rx="22" fill="url(#head)"/>
    <!-- Augen -->
    <circle cx="316" cy="200" r="9" fill="#052e16"/>
    <circle cx="316" cy="230" r="9" fill="#052e16"/>
    <!-- Zunge -->
    <path d="M338 215 h26 M364 215 l12 -8 M364 215 l12 8" stroke="#f87171" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Futter -->
  <circle cx="400" cy="360" r="66" fill="url(#foodglow)"/>
  <circle cx="400" cy="360" r="30" fill="#f87171"/>
  <circle cx="389" cy="349" r="9" fill="#ffffff" opacity="0.6"/>
